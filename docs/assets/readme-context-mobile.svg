<svg xmlns="http://www.w3.org/2000/svg" width="560" height="630" viewBox="0 0 560 630" role="img" aria-labelledby="title desc"><title id="title">本机资料与 API 的关系</title><desc id="desc">消息在本机结合角色、档位与回忆，再发送给用户配置的大脑 API；图片按需使用视觉 API。</desc><style>text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#30453E}.muted{fill:#6C756B}.coral{fill:#C95E49}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:600}.label{font-size:22px;font-weight:600}.small{font-size:17px}.tiny{font-size:14px}</style><rect x="1" y="1" width="558" height="628" rx="24" fill="#FAF6EE" stroke="#DEDCCD"/><text x="28" y="46" font-size="24" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">一句话，怎样来到它面前</text><rect x="24" y="69" width="512" height="319" rx="18" fill="#EEF0E5" stroke="#DEE2D1"/><text x="46" y="105" font-size="19" font-weight="600" fill="#58745D" style="fill:#58745D" text-anchor="start">你的电脑</text><rect x="46" y="128" width="222" height="65" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="157" y="169" font-size="24" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="middle">桌面对话</text><rect x="290" y="128" width="224" height="65" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="402" y="169" font-size="24" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="middle">原生 QQ</text><path d="M280 203V231m-5 -7 5 7 5-7" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="46" y="241" width="468" height="121" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="280" y="280" font-size="25" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="middle">当前角色 + 档位</text><text x="280" y="315" font-size="24" font-weight="400" fill="#30453E" style="fill:#30453E" text-anchor="middle">相关回忆 · 最近对话</text><text x="280" y="345" font-size="18" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="middle">按本轮需要准备上下文</text><path d="M280 398V438m-5 -7 5 7 5-7" fill="none" stroke="#C95E49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="304" y="423" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">请求</text><rect x="24" y="453" width="512" height="132" rx="18" fill="#F8E7DC" stroke="#EFD1BE"/><text x="46" y="486" font-size="19" font-weight="600" fill="#C95E49" style="fill:#C95E49" text-anchor="start">你配置的 API 服务</text><text x="46" y="525" font-size="24" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">文字与上下文 → 大脑 API</text><text x="46" y="561" font-size="22" font-weight="500" fill="#30453E" style="fill:#30453E" text-anchor="start">图片 → 视觉 API · 可选</text><text x="280" y="607" font-size="21" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="middle">选中的内容会发送到相应接口。</text></svg>
