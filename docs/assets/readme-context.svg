<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc"><title id="title">一句话，怎样来到它面前</title><desc id="desc">桌面与内置 QQ 把消息交给本机准备层，结合当前人格、档位和相关回忆，再发送到用户配置的大脑 API。图片在需要时另交视觉 API。资料文件在本机，选中的内容会随请求发送。</desc><style>text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#30453E}.muted{fill:#6C756B}.coral{fill:#C95E49}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:600}.label{font-size:22px;font-weight:600}.small{font-size:17px}.tiny{font-size:14px}</style><rect x="1" y="1" width="1198" height="348" rx="24" fill="#FAF6EE" stroke="#DEDCCD"/><text x="32" y="43" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">一句话，怎样来到它面前</text><rect x="28" y="63" width="728" height="242" rx="18" fill="#EEF0E5" stroke="#DEE2D1"/><rect x="881" y="63" width="291" height="242" rx="18" fill="#F8E7DC" stroke="#EFD1BE"/><text x="49" y="91" font-size="15" font-weight="650" fill="#58745D" style="fill:#58745D" text-anchor="start">你的电脑</text><text x="901" y="91" font-size="15" font-weight="650" fill="#C95E49" style="fill:#C95E49" text-anchor="start">你配置的 API 服务</text><rect x="49" y="113" width="209" height="65" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="153" y="151" font-size="22" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="middle">桌面对话</text><rect x="49" y="207" width="209" height="65" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="153" y="245" font-size="22" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="middle">原生 QQ</text><path d="M268 145h34v-3h33M268 239h34v-95" fill="none" stroke="#A6B399" stroke-width="2"/><path d="M327 137l8 5-8 5" fill="none" stroke="#A6B399" stroke-width="2"/><rect x="348" y="111" width="377" height="163" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="370" y="148" font-size="25" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">当前角色 + 档位</text><text x="370" y="183" font-size="22" font-weight="400" fill="#30453E" style="fill:#30453E" text-anchor="start">相关回忆 · 最近对话</text><text x="370" y="223" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">按本轮需要准备上下文</text><text x="370" y="252" font-size="16" font-weight="400" fill="#58745D" style="fill:#58745D" text-anchor="start">私人副本保存在本机</text><path d="M735 160H898m-7 -5 7 5-7 5" fill="none" stroke="#C95E49" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><text x="818" y="143" font-size="14" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="middle">文字与上下文</text><path d="M302 192V289H855V239H898m-7-5 7 5-7 5" fill="none" stroke="#C95E49" stroke-width="2" stroke-dasharray="5 5"/><text x="818" y="280" font-size="14" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="middle">图片 · 按需</text><rect x="905" y="115" width="242" height="66" rx="14" fill="#FFFEFA" stroke="#EDD0C0"/><text x="1026" y="155" font-size="24" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="middle">大脑 API</text><rect x="905" y="205" width="242" height="66" rx="14" fill="#FFFEFA" stroke="#EDD0C0"/><text x="1026" y="245" font-size="21" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="middle">视觉 API · 可选</text><text x="32" y="331" font-size="16" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">文件留在本机 ≠ 内容从不联网：选中的对话、回忆或图片会发送到相应接口。</text></svg>
