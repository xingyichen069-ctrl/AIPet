<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="270" viewBox="0 0 1200 270" role="img" aria-labelledby="title desc"><title id="title">第一次见面，还是搬个新家？</title><desc id="desc">新装：下载 main、准备环境、填写 API、启动。更新：退出旧程序、在独立新目录准备、迁移私人资料、检查后使用并保留旧目录。</desc><style>text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#30453E}.muted{fill:#6C756B}.coral{fill:#C95E49}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:600}.label{font-size:22px;font-weight:600}.small{font-size:17px}.tiny{font-size:14px}</style><rect x="1" y="1" width="1198" height="268" rx="24" fill="#FAF6EE" stroke="#DEDCCD"/><text x="28" y="35" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">第一次见面，还是搬个新家？</text><text x="28" y="100" font-size="18" font-weight="600" fill="#C95E49" style="fill:#C95E49" text-anchor="start">第一次使用</text><rect x="170" y="57" width="220" height="70" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="187" y="86" font-size="21" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">01 · 下载 main</text><text x="187" y="111" font-size="15" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">解压到可写目录</text><path d="M396 92H410m-7 -5 7 5-7 5" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="416" y="57" width="220" height="70" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="433" y="86" font-size="21" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">02 · 准备环境</text><text x="433" y="111" font-size="15" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">先安装 Python / uv</text><path d="M642 92H656m-7 -5 7 5-7 5" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="662" y="57" width="220" height="70" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="679" y="86" font-size="21" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">03 · 填写 API</text><text x="679" y="111" font-size="15" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">编辑 secrets.json</text><path d="M888 92H902m-7 -5 7 5-7 5" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="908" y="57" width="220" height="70" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="925" y="86" font-size="21" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">04 · 启动桌宠</text><text x="925" y="111" font-size="15" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">用一句“你好”确认</text><text x="28" y="192" font-size="18" font-weight="600" fill="#58745D" style="fill:#58745D" text-anchor="start">老朋友搬家</text><rect x="170" y="149" width="220" height="70" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="187" y="178" font-size="21" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">01 · 退出旧程序</text><text x="187" y="203" font-size="15" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">桌宠与 QQ 分别停止</text><path d="M396 184H410m-7 -5 7 5-7 5" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="416" y="149" width="220" height="70" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="433" y="178" font-size="21" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">02 · 准备新目录</text><text x="433" y="203" font-size="15" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">解压新版，准备环境</text><path d="M642 184H656m-7 -5 7 5-7 5" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="662" y="149" width="220" height="70" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="679" y="178" font-size="21" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">03 · 迁移私人资料</text><text x="679" y="203" font-size="15" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">选择旧安装目录</text><path d="M888 184H902m-7 -5 7 5-7 5" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="908" y="149" width="220" height="70" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="925" y="178" font-size="21" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">04 · 检查后使用</text><text x="925" y="203" font-size="15" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">保留旧目录供回退</text><text x="28" y="248" font-size="15" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">更新时：新目录先迁移，再启动。旧目录先留着。</text></svg>
