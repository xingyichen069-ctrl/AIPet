<svg xmlns="http://www.w3.org/2000/svg" width="560" height="620" viewBox="0 0 560 620" role="img" aria-labelledby="title desc"><title id="title">新装与更新路线图</title><desc id="desc">新装与更新是两条不同的路线；下面的详细说明保留全部步骤。</desc><style>text{font-family:"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;fill:#30453E}.muted{fill:#6C756B}.coral{fill:#C95E49}.eyebrow{font-size:13px;letter-spacing:2px;font-weight:600}.label{font-size:22px;font-weight:600}.small{font-size:17px}.tiny{font-size:14px}</style><rect x="1" y="1" width="558" height="618" rx="24" fill="#FAF6EE" stroke="#DEDCCD"/><text x="28" y="46" font-size="25" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">第一次见面 / 老朋友搬家</text><text x="136" y="94" font-size="21" font-weight="600" fill="#C95E49" style="fill:#C95E49" text-anchor="middle">第一次使用</text><rect x="24" y="119" width="242" height="86" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="39" y="153" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">1 · 下载 main</text><text x="39" y="183" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">解压到可写目录</text><path d="M145 211V225m-5 -7 5 7 5-7" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="230" width="242" height="86" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="39" y="264" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">2 · 准备环境</text><text x="39" y="294" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">先安装 Python / uv</text><path d="M145 322V336m-5 -7 5 7 5-7" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="341" width="242" height="86" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="39" y="375" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">3 · 填写 API</text><text x="39" y="405" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">编辑 secrets.json</text><path d="M145 433V447m-5 -7 5 7 5-7" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="24" y="452" width="242" height="86" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="39" y="486" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">4 · 启动桌宠</text><text x="39" y="516" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">用一句“你好”确认</text><text x="406" y="94" font-size="21" font-weight="600" fill="#58745D" style="fill:#58745D" text-anchor="middle">从旧版本更新</text><rect x="294" y="119" width="242" height="86" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="309" y="153" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">1 · 退出旧程序</text><text x="309" y="183" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">桌宠与 QQ 分别停止</text><path d="M415 211V225m-5 -7 5 7 5-7" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="294" y="230" width="242" height="86" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="309" y="264" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">2 · 准备新目录</text><text x="309" y="294" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">解压新版，准备环境</text><path d="M415 322V336m-5 -7 5 7 5-7" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="294" y="341" width="242" height="86" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="309" y="375" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">3 · 迁移私人资料</text><text x="309" y="405" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">选择旧安装目录</text><path d="M415 433V447m-5 -7 5 7 5-7" fill="none" stroke="#B1B7A5" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><rect x="294" y="452" width="242" height="86" rx="16" fill="#FFFEFA" stroke="#DEDCCD"/><text x="309" y="486" font-size="23" font-weight="600" fill="#30453E" style="fill:#30453E" text-anchor="start">4 · 检查后使用</text><text x="309" y="516" font-size="17" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="start">保留旧目录供回退</text><text x="280" y="585" font-size="21" font-weight="400" fill="#6C756B" style="fill:#6C756B" text-anchor="middle">先迁移，再启动。旧目录保留。</text></svg>
